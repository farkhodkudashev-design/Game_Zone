```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodGo — Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="container nav">
        <a href="index.html" class="logo">Food<span>Go</span></a>

        <nav class="navlinks">
            <a href="index.html">Главная</a>
            <a href="restaurants.html">Рестораны</a>
            <a href="about.html">О нас</a>
            <a href="contact.html">Контакты</a>
        </nav>
    </div>
</header>

<main class="auth">

    <div class="auth-box">

        <span class="eyebrow">🚀 Создайте аккаунт</span>

        <h1>Регистрация</h1>

        <p class="meta">
            Присоединяйтесь к FoodGo и заказывайте любимую еду.
        </p>

        <form>

            <div class="form-grid">

                <div class="field">
                    <label>Имя</label>
                    <input class="input" type="text" placeholder="Имя" required>
                </div>

                <div class="field">
                    <label>Фамилия</label>
                    <input class="input" type="text" placeholder="Фамилия" required>
                </div>

                <div class="field full">
                    <label>Email</label>
                    <input class="input" type="email" placeholder="example@mail.com" required>
                </div>

                <div class="field full">
                    <label>Телефон</label>
                    <input class="input" type="tel" placeholder="+998 90 000 00 00" required>
                </div>

                <div class="field">
                    <label>Пароль</label>
                    <input class="input" type="password" placeholder="Пароль" required>
                </div>

                <div class="field">
                    <label>Повторите пароль</label>
                    <input class="input" type="password" placeholder="Повторите пароль" required>
                </div>

            </div>

            <br>

            <label>
                <input type="checkbox" required>
                Я согласен с условиями использования
            </label>

            <button class="btn" type="submit">
                Создать аккаунт
            </button>

        </form>

        <br>

        <p class="meta">
            Уже есть аккаунт?
            <a href="login.html" class="link">Войти</a>
        </p>

    </div>

</main>

<footer>
    <div class="container">
        <div class="footer-bottom">
            <span>© 2026 FoodGo. Все права защищены.</span>
        </div>
    </div>
</footer>

</body>
</html>
```
